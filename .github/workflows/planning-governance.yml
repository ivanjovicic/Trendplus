name: Planning Governance

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - 'MASTER_ROADMAP.md'
      - 'docs/ANALYTICS_EXECUTION_PLAN.md'
      - 'docs/ai/**'
      - 'docs/planning/**'
      - 'docs/product/**'
      - 'docs/roadmaps/**'
      - 'docs/architecture/**'
      - 'docs/archive/planning/**'
      - 'docs/qa/ANALYTICS_QUEUE_RECONCILIATION.md'
      - 'docs/qa/TRENDPLUS_STABILIZATION_STATUS.md'
      - 'docs/qa/ANALYTICS_LIVE_SMOKE_RESULT.md'
      - 'docs/Analytics/ANALYTICS_PRODUCTION_READINESS_STATUS.md'
      - 'scripts/check-prompt-queues.mjs'
      - 'scripts/check-planning-architecture.mjs'
      - 'scripts/check-analytics-execution-plan.mjs'
      - 'scripts/check-agent-instructions.mjs'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/doc-links-baseline.txt'
      - 'README.md'
      - 'docs/**/*.md'
      - '.github/workflows/planning-governance.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - 'MASTER_ROADMAP.md'
      - 'docs/ANALYTICS_EXECUTION_PLAN.md'
      - 'docs/ai/**'
      - 'docs/planning/**'
      - 'docs/product/**'
      - 'docs/roadmaps/**'
      - 'docs/architecture/**'
      - 'docs/archive/planning/**'
      - 'docs/qa/ANALYTICS_QUEUE_RECONCILIATION.md'
      - 'docs/qa/TRENDPLUS_STABILIZATION_STATUS.md'
      - 'docs/qa/ANALYTICS_LIVE_SMOKE_RESULT.md'
      - 'docs/Analytics/ANALYTICS_PRODUCTION_READINESS_STATUS.md'
      - 'scripts/check-prompt-queues.mjs'
      - 'scripts/check-planning-architecture.mjs'
      - 'scripts/check-analytics-execution-plan.mjs'
      - 'scripts/check-agent-instructions.mjs'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/doc-links-baseline.txt'
      - 'README.md'
      - 'docs/**/*.md'
      - '.github/workflows/planning-governance.yml'

permissions:
  contents: read

concurrency:
  group: planning-governance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  validate-planning:
    name: Validate planning and queue architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Self-test agent instruction validator
        run: node scripts/check-agent-instructions.mjs --self-test

      - name: Validate agent instructions
        run: node scripts/check-agent-instructions.mjs

      - name: Self-test prompt queue validator
        run: node scripts/check-prompt-queues.mjs --self-test

      - name: Validate prompt queues
        run: node scripts/check-prompt-queues.mjs

      - name: Self-test planning architecture validator
        run: node scripts/check-planning-architecture.mjs --self-test

      - name: Validate planning architecture
        run: node scripts/check-planning-architecture.mjs

      - name: Self-test analytics execution plan validator
        run: node scripts/check-analytics-execution-plan.mjs --self-test

      - name: Validate analytics execution plan current truth
        run: node scripts/check-analytics-execution-plan.mjs

      - name: Self-test doc link validator
        run: node scripts/check-doc-links.mjs --self-test

      - name: Validate relative doc links
        run: node scripts/check-doc-links.mjs
