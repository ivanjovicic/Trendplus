name: Analytics Tests & Data Integrity

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/analytics-tests.yml'
      - 'Api/**'
      - 'Api.Tests/**'
      - 'Application/**'
      - 'Domain/**'
      - 'Infrastructure/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Complete backend analytics suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: trendplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trendplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: "Host=localhost;Database=trendplus_test;Username=postgres;Password=postgres_password"
      ConnectionStrings__AnalyticsConnection: "Host=localhost;Database=trendplus_test;Username=postgres;Password=postgres_password"
      ConnectionStrings__AnalyticsDb: "Host=localhost;Database=trendplus_test;Username=postgres;Password=postgres_password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        id: restore
        run: dotnet restore Api.Tests/Api.Tests.csproj

      - name: Build solution
        id: build
        run: dotnet build Api.Tests/Api.Tests.csproj --no-restore --configuration Release

      - name: Run migration and bootstrap lifecycle smoke
        id: migration_bootstrap_smoke
        run: >-
          dotnet test Api.Tests/Api.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --filter FullyQualifiedName~DatabaseMigrationBootstrapLifecycleSmokeTests

      - name: Run all backend tests with coverage
        id: test
        run: >-
          dotnet test Api.Tests/Api.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings Api.Tests/coverage.runsettings
          --results-directory TestResults
          --logger "trx;LogFileName=analytics-tests.trx"

      - name: Publish coverage summary
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          restore_outcome = os.environ.get("RESTORE_OUTCOME", "unknown")
          build_outcome = os.environ.get("BUILD_OUTCOME", "unknown")
          test_outcome = os.environ.get("TEST_OUTCOME", "unknown")

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Backend analytics test coverage\n\n")
              summary.write(
                  f"- Restore outcome: `{restore_outcome}`\n"
                  f"- Build outcome: `{build_outcome}`\n"
                  f"- Test outcome: `{test_outcome}`\n\n"
              )

              if reports:
                  root = ET.parse(reports[0]).getroot()
                  line_rate = float(root.attrib.get("line-rate", "0")) * 100
                  branch_rate = float(root.attrib.get("branch-rate", "0")) * 100
                  lines_covered = root.attrib.get("lines-covered", "0")
                  lines_valid = root.attrib.get("lines-valid", "0")
                  branches_covered = root.attrib.get("branches-covered", "0")
                  branches_valid = root.attrib.get("branches-valid", "0")

                  summary.write(f"- Line coverage: **{line_rate:.2f}%** ({lines_covered}/{lines_valid})\n")
                  summary.write(f"- Branch coverage: **{branch_rate:.2f}%** ({branches_covered}/{branches_valid})\n")
                  summary.write(f"- Cobertura reports: **{len(reports)}**\n")
                  sys.exit(0)

              if test_outcome == "success":
                  summary.write(
                      "Coverage collector did not produce `coverage.cobertura.xml` after a successful test run.\n"
                      "Treat this as a coverage-pipeline failure, not a secondary artifact issue.\n"
                  )
                  print(
                      "::error::Coverage collector produced no Cobertura report after successful tests.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if test_outcome == "failure":
                  summary.write(
                      "No Cobertura report is available because the test step failed. "
                      "Use the failing tests as the primary root cause; coverage was not required for this red run.\n"
                  )
              elif test_outcome == "skipped":
                  summary.write(
                      "No Cobertura report is available because the test step did not run "
                      f"(restore=`{restore_outcome}`, build=`{build_outcome}`). "
                      "Treat the earliest failed restore/build step as the primary root cause.\n"
                  )
              else:
                  summary.write(
                      f"No Cobertura report is available (test outcome=`{test_outcome}`). "
                      "Do not treat missing coverage as an independent root cause.\n"
                  )

              sys.exit(0)
          PY

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  rq447-certification:
    name: RQ447 Supplier/Shoe Type certification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trendplus_rq447
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trendplus_rq447"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      ASPNETCORE_ENVIRONMENT: Testing
      TRENDPLUS_RUN_INTEGRATION_TESTS: "true"
      Database__AutoMigrate: "false"
      # The CI PostgreSQL service is intentionally loopback-only. Testing is
      # not Development, so opt into that isolated target explicitly without
      # weakening the production default of AnalyticsConnectionResolver.
      Analytics__AllowLoopbackInProduction: "true"
      ConnectionStrings__DefaultConnection: "Host=localhost;Database=trendplus_rq447;Username=postgres;Password=postgres_password"
      ConnectionStrings__AnalyticsConnection: "Host=localhost;Database=trendplus_rq447;Username=postgres;Password=postgres_password"
      ConnectionStrings__AnalyticsDb: "Host=localhost;Database=trendplus_rq447;Username=postgres;Password=postgres_password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Restore dependencies
        run: dotnet restore Api.Tests/Api.Tests.csproj

      - name: Build certification test assembly
        run: dotnet build Api.Tests/Api.Tests.csproj --no-restore --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Apply current Trendplus migrations
        run: >-
          dotnet ef database update
          --project Infrastructure/Infrastructure.csproj
          --startup-project Api/Api.csproj
          --context TrendplusDbContext
          --configuration Release
          --verbose

      - name: Apply current Trendplus analytics migrations
        run: >-
          dotnet ef database update
          --project Infrastructure/Infrastructure.csproj
          --startup-project Api/Api.csproj
          --context AnalyticsDbContext
          --configuration Release
          --verbose

      - name: Apply Trendplus startup SQL bootstrap
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres_password
          PGDATABASE: trendplus_rq447
        run: |
          set -euo pipefail
          psql --version
          # The application startup path applies these idempotent scripts after
          # both EF contexts migrate. Certification must reproduce that path so
          # routes do not run against an artificially incomplete database.
          psql -v ON_ERROR_STOP=1 -f Database/Migrations/002_CreatePerformanceLogsTable.sql
          psql -v ON_ERROR_STOP=1 -f Database/Migrations/012_AddAccessImportSupport.sql
          psql -v ON_ERROR_STOP=1 -f Database/Migrations/017_CreateNightlyAnalyticsMaterializedViews.sql

      - name: Run RQ447 oracle cases
        id: oracle
        run: >-
          dotnet test Api.Tests/Api.Tests.csproj
          --no-build
          --configuration Release
          --filter FullyQualifiedName~SupplierShoeTypeIndependentOracleIntegrationTests
          --logger "trx;LogFileName=rq447-oracle.trx"
          --results-directory TestResults/rq447-oracle

      - name: Assert RQ447 oracle executed 4/4 with no skips
        if: always()
        env:
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("TestResults/rq447-oracle/**/*.trx", recursive=True)
          if not reports:
              print("::error::RQ447 oracle produced no TRX report.")
              sys.exit(1)

          root = ET.parse(reports[0]).getroot()
          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          results = root.findall(".//t:UnitTestResult", namespace)
          passed = sum(result.attrib.get("outcome") == "Passed" for result in results)
          skipped = sum(result.attrib.get("outcome") in {"Skipped", "NotExecuted"} for result in results)
          failed = len(results) - passed - skipped
          print(f"RQ447 oracle results: total={len(results)} passed={passed} skipped={skipped} failed={failed}")
          if os.environ.get("ORACLE_OUTCOME") != "success" or len(results) != 4 or passed != 4 or skipped != 0 or failed != 0:
              print("::error::RQ447 certification requires exactly 4 executed and passed oracle tests with zero skipped.")
              sys.exit(1)
          PY

      - name: Run RQ447 all-eight-routes proof
        id: routes
        run: >-
          dotnet test Api.Tests/Api.Tests.csproj
          --no-build
          --configuration Release
          --filter FullyQualifiedName~OperationsAnalyticsAllRoutesIntegrationTests
          --logger "trx;LogFileName=rq447-all-eight-routes.trx"
          --results-directory TestResults/rq447-all-eight-routes

      - name: Assert RQ447 all-eight-routes proof executed 1/1 with no skips
        if: always()
        env:
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("TestResults/rq447-all-eight-routes/**/*.trx", recursive=True)
          if not reports:
              print("::error::RQ447 all-eight-routes proof produced no TRX report.")
              sys.exit(1)

          root = ET.parse(reports[0]).getroot()
          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          results = root.findall(".//t:UnitTestResult", namespace)
          passed = sum(result.attrib.get("outcome") == "Passed" for result in results)
          skipped = sum(result.attrib.get("outcome") in {"Skipped", "NotExecuted"} for result in results)
          failed = len(results) - passed - skipped
          print(f"RQ447 all-eight-routes results: total={len(results)} passed={passed} skipped={skipped} failed={failed}")
          if os.environ.get("ROUTES_OUTCOME") != "success" or len(results) != 1 or passed != 1 or skipped != 0 or failed != 0:
              print("::error::RQ447 all-eight-routes certification requires exactly 1 executed and passed test with zero skipped.")
              sys.exit(1)
          PY

      - name: Run RQ447 OP2 seam reproducers
        id: seams
        run: >-
          dotnet test Api.Tests/Api.Tests.csproj
          --no-build
          --configuration Release
          --filter FullyQualifiedName~SupplierShoeTypeRq447SeamIntegrationTests
          --logger "trx;LogFileName=rq447-op2-seams.trx"
          --results-directory TestResults/rq447-op2-seams

      - name: Assert RQ447 OP2 reproducers executed 4/4 with no skips
        if: always()
        env:
          SEAMS_OUTCOME: ${{ steps.seams.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("TestResults/rq447-op2-seams/**/*.trx", recursive=True)
          if not reports:
              print("::error::RQ447 OP2 seam reproducers produced no TRX report.")
              sys.exit(1)

          root = ET.parse(reports[0]).getroot()
          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          results = root.findall(".//t:UnitTestResult", namespace)
          passed = sum(result.attrib.get("outcome") == "Passed" for result in results)
          skipped = sum(result.attrib.get("outcome") in {"Skipped", "NotExecuted"} for result in results)
          failed = len(results) - passed - skipped
          print(f"RQ447 OP2 results: total={len(results)} passed={passed} skipped={skipped} failed={failed}")
          if os.environ.get("SEAMS_OUTCOME") != "success" or len(results) != 4 or passed != 4 or skipped != 0 or failed != 0:
              print("::error::RQ447 certification requires exactly 4 executed and passed OP2 reproducers with zero skipped.")
              sys.exit(1)
          PY

      - name: Run RQ447 frontend route/status seam proof
        working-directory: Klijent/clientapp
        run: |
          npm ci
          npm run test:run -- \
            src/pages/__tests__/SupplierRedirects.spec.tsx \
            src/pages/__tests__/SupplierSalesStatsPage.premium.spec.tsx \
            --testNamePattern="legacy redirect|preserves gated supplier status identity"

      - name: Upload RQ447 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq447-certification-${{ github.sha }}
          path: TestResults/rq447-*
          if-no-files-found: error
          retention-days: 30
