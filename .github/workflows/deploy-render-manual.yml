name: Manual: Deploy to Render (fallback)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: false
        default: 'main'

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          set -e
          REF="${DEPLOY_REF:-main}"
          echo "Triggering Render deploy for ref: $REF"
          for i in 1 2 3; do
            echo "Attempt $i to trigger deploy..."
            status=$(curl -s -o response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys)
            echo "HTTP Status: $status"
            cat response.json || true
            if [ "$status" -eq 201 ]; then
              echo "Deploy triggered successfully"
              exit 0
            fi
            echo "Deploy failed, retrying in 5s..."
            sleep 5
          done
          echo "Deploy failed after 3 attempts"
          cat response.json || true
          exit 1
