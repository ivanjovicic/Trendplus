name: "Manual: Deploy to Render (fallback)"

on:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Application/**'
      - 'Domain/**'
      - 'Infrastructure/**'
      - 'Klijent/clientapp/**'
      - 'render.yaml'
      - 'docker-compose.production.yml'
      - '.github/workflows/deploy-render-manual.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Operator note only; Render deploys the service-configured branch'
        required: false
        default: 'main'

concurrency:
  group: render-deploy-main
  cancel-in-progress: true

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
          DEPLOY_REF: ${{ github.event.inputs.ref }}
          TARGET_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="${DEPLOY_REF:-main}"
          echo "Triggering Render deploy for ref: $REF"
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY is not configured."
            exit 1
          fi
          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "RENDER_SERVICE_ID is not configured."
            exit 1
          fi

          service_ids=("${RENDER_SERVICE_ID}")
          if [ -n "${RENDER_WORKER_SERVICE_ID:-}" ] && [ "${RENDER_WORKER_SERVICE_ID}" != "${RENDER_SERVICE_ID}" ]; then
            service_ids+=("${RENDER_WORKER_SERVICE_ID}")
          else
            echo "RENDER_WORKER_SERVICE_ID is not configured; worker deploy trigger will be skipped."
          fi

          trigger_service_deploy() {
            local service_id="$1"
            local response_file
            response_file="$(mktemp)"

            for i in 1 2 3; do
              echo "Attempt $i to trigger deploy for service ${service_id}..."
              status=$(curl -s -o "${response_file}" -w "%{http_code}" \
                -X POST \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"commitId\":\"${TARGET_COMMIT_SHA}\"}" \
                "https://api.render.com/v1/services/${service_id}/deploys")
              echo "HTTP Status for ${service_id}: $status"
              cat "${response_file}" || true
              if [ "$status" -eq 201 ] || [ "$status" -eq 202 ]; then
                deploy_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "${response_file}")
                deploy_status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "${response_file}")
                if [ -z "${deploy_id}" ]; then
                  echo "Render deploy response did not include a deploy id for ${service_id}."
                  cat "${response_file}" || true
                  rm -f "${response_file}"
                  return 1
                fi
                echo "Deploy triggered successfully for ${service_id}. DeployId=${deploy_id} InitialStatus=${deploy_status}"
                rm -f "${response_file}"
                poll_service_deploy "${service_id}" "${deploy_id}"
                return 0
              fi
              echo "Deploy failed for ${service_id}, retrying in 5s..."
              sleep 5
            done

            echo "Deploy failed after 3 attempts for ${service_id}"
            cat "${response_file}" || true
            rm -f "${response_file}"
            return 1
          }

          poll_service_deploy() {
            local service_id="$1"
            local deploy_id="$2"
            local max_attempts=45

            for attempt in $(seq 1 "${max_attempts}"); do
              local poll_file
              local poll_status
              poll_file="$(mktemp)"
              poll_status=$(curl -s -o "${poll_file}" -w "%{http_code}" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}")
              if [ "${poll_status}" -ne 200 ]; then
                echo "Polling deploy ${deploy_id} for ${service_id} failed with HTTP ${poll_status}."
                cat "${poll_file}" || true
                rm -f "${poll_file}"
                return 1
              fi

              local status
              status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "${poll_file}")
              echo "Deploy ${deploy_id} for ${service_id} status: ${status} (attempt ${attempt}/${max_attempts})"

              case "${status}" in
                created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                  rm -f "${poll_file}"
                  sleep 10
                  ;;
                live)
                  cat "${poll_file}" || true
                  rm -f "${poll_file}"
                  return 0
                  ;;
                *)
                  echo "Deploy ${deploy_id} for ${service_id} ended in non-live status."
                  cat "${poll_file}" || true
                  rm -f "${poll_file}"
                  return 1
                  ;;
              esac
            done

            echo "Timed out waiting for Render deploy ${deploy_id} on ${service_id} to become live."
            return 1
          }

          for service_id in "${service_ids[@]}"; do
            trigger_service_deploy "${service_id}"
          done
