# Prometheus scrape config for RabbitMQ
scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']  # RabbitMQ Prometheus plugin
    metrics_path: /metrics
    scrape_interval: 30s

